services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: computer-store-app:latest
    restart: unless-stopped
    networks:
      - default
      - vpn-net
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-computer_store}
      DB_USERNAME: ${DB_USERNAME:-computer_store}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  phpmyadmin:
    image: phpmyadmin:5-apache
    profiles:
      - tools
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: computer-store-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-computer_store}
      DB_USERNAME: ${DB_USERNAME:-computer_store}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      QUEUE_CONNECTION: database
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=90
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage

  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-computer_store}
      MYSQL_USER: ${DB_USERNAME:-computer_store}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_storage:
  mysql_data:

networks:
  vpn-net:
    external: true
    name: vpn-net
